<svg width="100%" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="20" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="56" fill="#FFFFFF" font-size="26" font-weight="700">VisionForge</text>
  <text x="40" y="84" fill="#8FA3C4" font-size="16">A 3D design file in. A real-time detector on your phone out. Zero manual labeling.</text>

  <!-- accent underline -->
  <rect x="40" y="98" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- pipeline -->
  <g filter="url(#sh)">
    <!-- 5 cards -->
    <!-- card geometry: x positions -->
    <!-- Card 1: Upload -->
    <rect x="40"  y="150" width="190" height="160" rx="14" fill="#16213A" stroke="#24324F"/>
    <!-- Card 2: Auto-label -->
    <rect x="270" y="150" width="190" height="160" rx="14" fill="#16213A" stroke="#24324F"/>
    <!-- Card 3: Train -->
    <rect x="500" y="150" width="190" height="160" rx="14" fill="#16213A" stroke="#24324F"/>
    <!-- Card 4: Export -->
    <rect x="730" y="150" width="190" height="160" rx="14" fill="#16213A" stroke="#24324F"/>
    <!-- Card 5: Detect -->
    <rect x="960" y="150" width="200" height="160" rx="14" fill="#16213A" stroke="url(#accent)" stroke-width="2"/>
  </g>

  <!-- arrows between cards -->
  <g fill="none" stroke="url(#accent)" stroke-width="3">
    <path d="M232 230 L268 230" marker-end="url(#arr)"/>
    <path d="M462 230 L498 230" marker-end="url(#arr)"/>
    <path d="M692 230 L728 230" marker-end="url(#arr)"/>
    <path d="M922 230 L958 230" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00C2FF"/>
    </marker>
  </defs>

  <!-- ===== Card 1: Upload (3D file) ===== -->
  <g transform="translate(135,205)">
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="none" stroke="#00C2FF" stroke-width="3"/>
    <path d="M-26 -10 L0 -22 L26 -10 L0 2 Z" fill="#2563EB" opacity="0.9"/>
    <path d="M-26 -10 L0 2 L0 26 L-26 14 Z" fill="#1E3A8A" opacity="0.9"/>
    <path d="M26 -10 L0 2 L0 26 L26 14 Z" fill="#3B82F6" opacity="0.9"/>
  </g>
  <text x="135" y="282" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Upload</text>
  <text x="135" y="300" text-anchor="middle" fill="#7E92B4" font-size="11.5">STEP · BLEND · OBJ</text>

  <!-- ===== Card 2: Auto-label ===== -->
  <g transform="translate(365,205)">
    <rect x="-30" y="-26" width="60" height="52" rx="4" fill="#0E1A30"/>
    <rect x="-22" y="-16" width="24" height="22" rx="2" fill="none" stroke="#FF5C5C" stroke-width="2.5"/>
    <rect x="6"  y="-4" width="18" height="16" rx="2" fill="none" stroke="#48F90A" stroke-width="2.5"/>
    <rect x="-12" y="6" width="16" height="12" rx="2" fill="none" stroke="#00C2FF" stroke-width="2.5"/>
  </g>
  <text x="365" y="282" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Auto-label</text>
  <text x="365" y="300" text-anchor="middle" fill="#7E92B4" font-size="11.5">Blender renders + boxes</text>

  <!-- ===== Card 3: Train ===== -->
  <g transform="translate(595,205)">
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="none" stroke="#00C2FF" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#2563EB"/>
    <line x1="-22" y1="-12" x2="-34" y2="-12" stroke="#00C2FF" stroke-width="3"/>
    <line x1="-22" y1="12" x2="-34" y2="12" stroke="#00C2FF" stroke-width="3"/>
    <line x1="22" y1="-12" x2="34" y2="-12" stroke="#00C2FF" stroke-width="3"/>
    <line x1="22" y1="12" x2="34" y2="12" stroke="#00C2FF" stroke-width="3"/>
    <line x1="-12" y1="-22" x2="-12" y2="-34" stroke="#00C2FF" stroke-width="3"/>
    <line x1="12" y1="-22" x2="12" y2="-34" stroke="#00C2FF" stroke-width="3"/>
  </g>
  <text x="595" y="282" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Train</text>
  <text x="595" y="300" text-anchor="middle" fill="#7E92B4" font-size="11.5">YOLO model</text>

  <!-- ===== Card 4: Export ===== -->
  <g transform="translate(825,205)">
    <rect x="-16" y="-28" width="32" height="56" rx="6" fill="none" stroke="#00C2FF" stroke-width="3"/>
    <line x1="-16" y1="18" x2="16" y2="18" stroke="#00C2FF" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#48F90A" font-size="11" font-weight="700">TFLite</text>
  </g>
  <text x="825" y="282" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Export</text>
  <text x="825" y="300" text-anchor="middle" fill="#7E92B4" font-size="11.5">TFLite · CoreML</text>

  <!-- ===== Card 5: Detect (phone w/ boxes) ===== -->
  <g transform="translate(1060,203)">
    <rect x="-22" y="-30" width="44" height="62" rx="7" fill="#0E1A30" stroke="#00C2FF" stroke-width="2.5"/>
    <rect x="-14" y="-18" width="16" height="14" rx="2" fill="none" stroke="#FF5C5C" stroke-width="2"/>
    <rect x="2" y="2" width="14" height="12" rx="2" fill="none" stroke="#48F90A" stroke-width="2"/>
    <circle cx="0" cy="26" r="2.5" fill="#00C2FF"/>
  </g>
  <text x="1060" y="284" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Detect</text>
  <text x="1060" y="302" text-anchor="middle" fill="#7E92B4" font-size="11.5">Live, on-device</text>

  <!-- footer chip -->
  <rect x="40" y="334" width="430" height="26" rx="13" fill="#16213A" stroke="#24324F"/>
  <text x="58" y="351" fill="#8FA3C4" font-size="12.5">Labels come from your design file — name a part, detect a part.</text>
</svg>
